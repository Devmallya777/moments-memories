<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Now</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<section class="order-page">

    <div class="order-container">

        <h1>Place Your Order 💖</h1>

        <form id="orderForm">

            <!-- PRODUCT SELECT -->

            <label>Select Product</label>

            <select id="productSelect">

                <option value="Male Basic Box|499">
                    Male Basic Box
                </option>

                <option value="Male Premium Box|799">
                    Male Premium Box
                </option>

                <option value="Female Basic Box|499">
                    Female Basic Box
                </option>

                <option value="Female Premium Box|799">
                    Female Premium Box
                </option>

            </select>





            <!-- PRODUCT DETAILS -->

            <div class="selected-product">

                <h2 id="productName">
                    Product Name
                </h2>

                <h3 id="productPrice">
                    ₹0
                </h3>

            </div>

            <input type="hidden" id="priceInput">





            <!-- USER DETAILS -->

            <input
            type="text"
            id="name"
            placeholder="Your Name"
            required>

            <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required>

            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>





            <!-- ADDRESS -->

            <textarea
            id="address"
            placeholder="Your Address"></textarea>





            <!-- MESSAGE -->

            <textarea
            id="message"
            placeholder="Special Message"></textarea>





            <!-- FILE -->

            <label class="upload-label">
                Upload Photos / Videos
            </label>

            <input type="file" multiple>





            <!-- BUTTON -->

            <button type="submit">

                Send Order 💌

            </button>





            <!-- SUCCESS -->

            <p id="successMessage"></p>

        </form>

    </div>

</section>





<script>

// ================= GET URL DATA =================

const params =
new URLSearchParams(window.location.search);

const product =
params.get("product");

const price =
params.get("price");



// ================= ELEMENTS =================

const productSelect =
document.getElementById("productSelect");

const productName =
document.getElementById("productName");

const productPrice =
document.getElementById("productPrice");

const priceInput =
document.getElementById("priceInput");



// ================= AUTO SELECT PRODUCT =================

if(product && price){

    productName.innerText = product;

    productPrice.innerText = `₹${price}`;

    priceInput.value = `₹${price}`;



    // AUTO SELECT DROPDOWN

    for(let i = 0; i < productSelect.options.length; i++){

        if(
            productSelect.options[i].text.includes(product)
        ){

            productSelect.selectedIndex = i;

        }

    }

}



// ================= MANUAL DROPDOWN CHANGE =================

productSelect.addEventListener(
"change",
function(){

    const selected =
    this.value;

    const splitData =
    selected.split("|");

    const selectedProduct =
    splitData[0];

    const selectedPrice =
    splitData[1];

    productName.innerText =
    selectedProduct;

    productPrice.innerText =
    `₹${selectedPrice}`;

    priceInput.value =
    `₹${selectedPrice}`;

}
);




// ================= SEND ORDER =================

const orderForm =
document.getElementById("orderForm");

orderForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

document.getElementById(
"successMessage"
).innerText =
"Order Sent Successfully 💖";

orderForm.reset();

});
</script>

</body>
</html>
