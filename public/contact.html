<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo-area">

        <img src="logo.png" alt="Moments & Memories" class="logo-img">

        <div class="logo-text">
            Moments & Memories 💖
        </div>

    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Order</a>
        <a href="cart.html">Cart 🛒</a>

    </div>

</nav>

<div class="form-box">

    <h1 class="section-title">Place Your Order 💌</h1>

    <form>

        <div class="input-group">
            <input type="text" placeholder="Your Name">
        </div>

        <div class="input-group">
            <input type="text" placeholder="Phone Number">
        </div>

        <div class="input-group">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-group">
            <textarea rows="5" placeholder="Your Address"></textarea>
        </div>

        <div class="input-group">
            <textarea rows="5" placeholder="Special Message"></textarea>
        </div>

        <div class="input-group">
            <input type="file">
        </div>

        <button class="btn" type="submit">Send Order 💖</button>

    </form>

</div>

<footer>
    Thank You For Choosing Us 💕
</footer>
<script src="script.js"></script>
</body>
</html>
