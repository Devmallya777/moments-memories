<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo-area">

        <img src="logo.png" alt="Moments & Memories" class="logo">

        <h1>Moments & Memories 💖</h1>

    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Order</a>
        <a href="cart.html">Cart 🛒</a>

    </div>

</nav>

<!-- ORDER PAGE -->

<section class="order-page">

<form id="orderForm">

<div class="input-group">
    <input type="text" id="productField" placeholder="Product" readonly>
</div>

<div class="input-group">
    <input type="text" id="priceField" placeholder="Price" readonly>
</div>

<div class="input-group">
    <input type="text" id="name" placeholder="Your Name" required>
</div>

<div class="input-group">
    <input type="text" id="phone" placeholder="Phone Number" required>
</div>

<div class="input-group">
    <input type="email" id="email" placeholder="Email Address" required>
</div>

<div class="input-group">
    <textarea id="address" rows="5" placeholder="Your Address"></textarea>
</div>

<div class="input-group">
    <textarea id="message" rows="5" placeholder="Special Message"></textarea>
</div>

<button class="btn" type="submit">
    Send Order 💖
</button>

</form>

<script src="script.js"></script>


    </div>

</section>

<footer>
    Thank You For Choosing Us 💕
</footer>

<script src="script.js"></script>

</body>

</html>
