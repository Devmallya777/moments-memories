```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Contact
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header class="navbar">

<div class="logo">
Moments & Memories 💖
</div>

<nav>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

<li><a href="admin.html">Admin</a></li>

</ul>

</nav>

</header>


<section class="contact-section">

<form id="contactForm"
class="contact-form">

<h1>
Contact Us 💌
</h1>

<input type="text"
id="name"
placeholder="Your Name"
required>

<input type="email"
id="email"
placeholder="Your Email"
required>

<input type="text"
id="phone"
placeholder="Phone Number">

<textarea id="message"
placeholder="Your Message"
required></textarea>

<button type="submit">

Send Message

</button>

</form>

</section>

<script>

document.getElementById(
"contactForm"
).addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const response =
await fetch("/send-email",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("name").value,

email:
document.getElementById("email").value,

phone:
document.getElementById("phone").value,

message:
document.getElementById("message").value

})

});

const data =
await response.json();

if(data.success){

alert("Message Sent 💖");

}else{

alert("Failed To Send");

}

});

</script>

</body>
</html>
```
