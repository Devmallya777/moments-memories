<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Moments & Memories</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8efea;
      color: #5c2d3a;
    }

    nav {
      background: #f3d6d8;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h1 {
      color: #7a3d4d;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: #5c2d3a;
      font-weight: bold;
    }

    .contact-section {
      max-width: 700px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #b76e79;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #f3d6d8;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #d88c9a;
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #b76e79;
    }

    #responseMsg {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #f3d6d8;
      margin-top: 40px;
      color: #5c2d3a;
    }
  </style>
</head>
<body>

  <nav>
    <h1>Moments & Memories</h1>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <section class="contact-section">
    <h2>Contact Us 💌</h2>

    <form id="contactForm">
      <div class="input-group">
        <label>Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="input-group">
        <label>Phone</label>
        <input type="text" id="phone" />
      </div>

      <div class="input-group">
        <label>Message</label>
        <textarea id="message" required></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div id="responseMsg"></div>
  </section>

  <footer>
    © 2026 Moments & Memories | Made with 💖
  </footer>

  <script>
    const form = document.getElementById("contactForm");
    const responseMsg = document.getElementById("responseMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        message: document.getElementById("message").value,
      };

      responseMsg.innerHTML = "Sending message...";

      try {
        const response = await fetch("/send-email", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();

        if (result.success) {
          responseMsg.style.color = "green";
          responseMsg.innerHTML = "Message sent successfully 💖";
          form.reset();
        } else {
          responseMsg.style.color = "red";
          responseMsg.innerHTML = "Failed to send message";
        }
      } catch (error) {
        responseMsg.style.color = "red";
        responseMsg.innerHTML = "Server Error";
      }
    });
  </script>
</body>
</html>
