<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo-area">

        <img src="logo.png" alt="Moments & Memories" class="logo">

        <h1>Moments & Memories 💖</h1>

    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Order</a>
        <a href="cart.html">Cart 🛒</a>

    </div>

</nav>

<!-- ORDER PAGE -->

<section class="order-page">

    <div class="form-box">

        <h1 class="section-title">
            Place Your Order 💌
        </h1>

        <form id="orderForm">

            <div class="input-group">
                <input
                type="text"
                id="name"
                placeholder="Your Name"
                required>
            </div>

            <div class="input-group">
                <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required>
            </div>

            <div class="input-group">
                <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>
            </div>

            <div class="input-group">
                <textarea
                id="address"
                rows="4"
                placeholder="Your Address"
                required></textarea>
            </div>

            <div class="input-group">
                <textarea
                id="message"
                rows="4"
                placeholder="Special Message"></textarea>
            </div>

            <button class="btn" type="submit">
                Confirm Order 💖
            </button>

        </form>

    </div>

</section>

<footer>
    Thank You For Choosing Us 💕
</footer>

<script src="script.js"></script>

</body>

</html>
