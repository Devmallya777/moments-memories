<section class="contact-section">

    <div class="contact-box">

        <h1>
            Contact Us
        </h1>

        <form
            id="contactForm"
            class="contact-form"
        >

            <input
                type="text"
                id="name"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Your Email"
                required
            >

            <textarea
                id="message"
                placeholder="Your Message"
                required
            ></textarea>

            <button class="btn">
                Send Message
            </button>

        </form>

        <!-- CONTACT LINKS -->

        <div class="contact-links">

            <div class="contact-item">

                <h3>Instagram</h3>

                <a
                    href="https://instagram.com/_mm.giftboxes__"
                    target="_blank"
                >
                    @_mm.giftboxes__
                </a>

            </div>

            <div class="contact-item">

                <h3>Email</h3>

                <a
                    href="mailto:mm.giftboxes04@gmail.com"
                >
                    mm.giftboxes04@gmail.com
                </a>

            </div>

            <div class="contact-item">

                <h3>Phone</h3>

                <a
                    href="tel:+919083791493"
                >
                    +91 90837 91493
                </a>

            </div>

        </div>

    </div>

</section>
