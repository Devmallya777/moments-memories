<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Us</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<header class="navbar">

<div class="logo">
Moments & Memories 💖
</div>

<nav>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Products</a></li>

<li><a href="about.html">About</a></li>

<li><a href="order.html">Order Us</a></li>

<li><a href="admin.html">Admin</a></li>

</ul>

</nav>

</header>


<section class="order-page">


<div class="order-left">

<img src="https://images.unsplash.com/photo-1513475382585-d06e58bcb0ff?q=80&w=1200&auto=format&fit=crop">

</div>


<div class="order-right">

<h1>Place Your Order 💖</h1>

<p>
Luxury handcrafted gift boxes made specially for unforgettable memories ✨
</p>


<form id="orderForm">


<div class="input-group">

<label>Select Product</label>

<select id="product" required>

<option value="">Choose Product</option>

<option value="499">
Basic Gift Box - ₹499
</option>

<option value="799">
Premium Gift Box - ₹799
</option>

<option value="999">
Couple Surprise Box - ₹999
</option>

<option value="1499">
Luxury Anniversary Box - ₹1499
</option>

</select>

</div>


<div class="input-group">

<label>Total Price</label>

<input type="text" id="price" readonly>

</div>


<div class="input-group">

<label>Full Name</label>

<input type="text" id="name" required>

</div>


<div class="input-group">

<label>Email Address</label>

<input type="email" id="email" required>

</div>


<div class="input-group">

<label>Phone Number</label>

<input type="text" id="phone" required>

</div>


<div class="input-group">

<label>Full Address</label>

<textarea id="address" rows="4" required></textarea>

</div>


<div class="input-group">

<label>Occasion</label>

<select id="occasion">

<option>Birthday</option>

<option>Anniversary</option>

<option>Wedding</option>

<option>Valentine</option>

<option>Friendship</option>

<option>Custom</option>

</select>

</div>


<div class="input-group">

<label>Gift Message</label>

<textarea id="message"
rows="4"
placeholder="Write your custom message ❤️"></textarea>

</div>


<button type="submit"
class="order-btn">

Place Order 💖

</button>

</form>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
