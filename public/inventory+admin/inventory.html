<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>

  <link rel="stylesheet" href="inventory.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">
<a href="dashboard.html">📊 Dashboard</a>
<a href="inventory.html">📦 Inventory</a>
<a href="orders.html" class="active">🛒 Orders</a>
<a href="agents.html">🚚 Delivery Agents</a>
<a href="finance.html">💰 Finance</a>
<a href="members.html">👥 Team Members</a>
<a href="settings.html">⚙️ Settings</a>
<a href="login.html" id="logout-btn">🚪 Logout</a>
</div>

<div class="main">

  <h1>Inventory Management</h1>

  <!-- STATS -->
  <div class="stats">
    <div class="card"><h3 id="totalItems">0</h3><p>Total Items</p></div>
    <div class="card"><h3 id="lowStock">0</h3><p>Low Stock</p></div>
    <div class="card"><h3 id="outStock">0</h3><p>Out of Stock</p></div>
    <div class="card"><h3 id="totalValue">₹0</h3><p>Total Value</p></div>
  </div>

  <!-- ADD ITEM -->
  <div class="add-box">
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="stock" placeholder="Stock">
    <input type="number" id="cost" placeholder="Unit Cost">
    <button onclick="addItem()">Add Item</button>
  </div>

  <!-- SEARCH BOX -->
  <div style="margin:15px 0;">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search items..."
      onkeyup="renderTable()"
      style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;"
    />
  </div>

  <!-- TABLE -->
  <div class="card table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Stock</th>
          <th>Cost</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="inventoryTable">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="inventory.js"></script>

</body>
</html>
