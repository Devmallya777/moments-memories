<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments & Memories</title>

    <link rel="stylesheet" href="style.css">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo-section">

            <img src="logo.png" alt="logo">

            <div>
                <h1>Moments & Memories</h1>
                <p>WHERE EVERY GIFT TELLS A STORY</p>
            </div>

        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Order</a>
        </nav>

    </header>



    <!-- ================= CATEGORY BAR ================= -->

    <section class="categories-bar">

        <div class="category-item">

            <div class="category-img-wrap female">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=400&auto=format&fit=crop" alt="">
            </div>

            <p>For Her</p>

        </div>


        <div class="category-item">

            <div class="category-img-wrap male">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=400&auto=format&fit=crop" alt="">
            </div>

            <p>For Him</p>

        </div>

    </section>



    <!-- ================= HERO SECTION ================= -->

    <section class="hero">

        <div class="hero-text">

            <span>CUSTOMIZED GIFT BOXES</span>

            <h2>
                Gifts Made <br>
                With Love 💖
            </h2>

            <p>
                Thoughtful gifts beautifully curated for birthdays,
                anniversaries, friendships and unforgettable memories.
            </p>

            <div class="hero-buttons">
                <button class="btn-primary">Explore Gifts</button>
                <button class="btn-outline">Order Now</button>
            </div>

        </div>


        <div class="hero-image">

            <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=1200&auto=format&fit=crop" alt="gift">

        </div>

    </section>

</body>
</html>
