<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <h1>
            Admin Dashboard
        </h1>

        <div class="stats-grid">

            <div class="stat-card">

                <h2 id="productsCount">0</h2>

                <p>Total Products</p>

            </div>

            <div class="stat-card">

                <h2 id="contactsCount">0</h2>

                <p>Total Contacts</p>

            </div>

            <div class="stat-card">

                <h2 id="ordersCount">0</h2>

                <p>Total Orders</p>

            </div>

        </div>

    </div>

    <script>

        async function loadDashboard() {

            const res = await fetch("/api/dashboard");

            const data = await res.json();

            document.getElementById("productsCount").innerText = data.products;

            document.getElementById("contactsCount").innerText = data.contacts;

            document.getElementById("ordersCount").innerText = data.orders;

        }

        loadDashboard();

    </script>

</body>

</html>
