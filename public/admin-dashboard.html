<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Moments & Memories</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PASSWORD PROTECTION -->

<script>

const pass = prompt("Enter Admin Password");

if(pass !== "moments2026"){

  alert("Wrong Password");
  window.location.href = "index.html";

}

</script>

<!-- NAVBAR -->

<nav class="navbar">

  <div class="logo">
    Moments <span>& Memories</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </div>

</nav>

<!-- DASHBOARD -->

<section class="section">

  <h1 class="section-title">Admin Dashboard</h1>

  <div class="dashboard">

    <div class="card">
      <h2 id="productsCount">0</h2>
      <p>Total Products</p>
    </div>

    <div class="card">
      <h2 id="ordersCount">0</h2>
      <p>Total Orders</p>
    </div>

    <div class="card">
      <h2 id="contactsCount">0</h2>
      <p>Total Contacts</p>
    </div>

  </div>

</section>

<!-- FOOTER -->

<footer>

  <p>
    © 2026 Moments & Memories | Admin Panel
  </p>

</footer>

<!-- SCRIPT -->

<script>

async function loadDashboard(){

  try{

    // PRODUCTS
    const productsRes = await fetch("/api/products");
    const products = await productsRes.json();

    // CONTACTS
    const contactsRes = await fetch("/api/contact");
    const contacts = await contactsRes.json();

    // ORDERS
    const ordersRes = await fetch("/api/orders");
    const orders = await ordersRes.json();

    document.getElementById("productsCount").innerText = products.length;

    document.getElementById("contactsCount").innerText = contacts.length;

    document.getElementById("ordersCount").innerText = orders.length;

  }catch(error){

    console.log(error);

  }

}

loadDashboard();

</script>

</body>
</html>
