<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fffaf5;
}

nav{
background:#111;
padding:18px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#ffb347;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
gap:25px;
list-style:none;
}

nav ul li a{
color:white;
text-decoration:none;
font-size:18px;
}

.dashboard{
padding:70px 8%;
}

.dashboard h1{
font-size:50px;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.card h2{
font-size:35px;
margin-bottom:20px;
}

.counter{
font-size:45px;
font-weight:bold;
color:#ff6600;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:60px;
}

</style>
</head>

<body>

<nav>

<div class="logo">Moments & Memories</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="admin-dashboard.html">Admin</a></li>
</ul>

</nav>

<section class="dashboard">

<h1>Admin Dashboard 🚀</h1>

<div class="cards">

<div class="card">
<h2>Total Products</h2>
<div class="counter" data-target="120">0</div>
</div>

<div class="card">
<h2>Total Orders</h2>
<div class="counter" data-target="350">0</div>
</div>

<div class="card">
<h2>Total Users</h2>
<div class="counter" data-target="900">0</div>
</div>

<div class="card">
<h2>Total Contacts</h2>
<div class="counter" data-target="180">0</div>
</div>

</div>

</section>

<footer>
© 2026 Moments & Memories | Made by dev
</footer>

<script src="script.js"></script>

</body>
</html>
