<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Management</title>

<link rel="stylesheet" href="inventory.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="sidebar">

    <h2>M&M</h2>

    <a href="#">Dashboard</a>
    <a href="#">Inventory</a>
    <a href="#">Orders</a>
    <a href="#">Settings</a>

</div>

<div class="main">

    <div class="topbar">

        <h1>Inventory Management</h1>

    </div>

    <div class="stats">

        <div class="card">
            <h3 id="totalItems">0</h3>
            <p>Total Items</p>
        </div>

        <div class="card">
            <h3 id="lowStock">0</h3>
            <p>Low Stock</p>
        </div>

        <div class="card">
            <h3 id="outStock">0</h3>
            <p>Out Of Stock</p>
        </div>

        <div class="card">
            <h3 id="totalValue">₹0</h3>
            <p>Total Value</p>
        </div>

    </div>

    <div class="add-box">

        <input
        type="text"
        id="itemName"
        placeholder="Item Name">

        <input
        type="number"
        id="stock"
        placeholder="Stock">

        <input
        type="number"
        id="cost"
        placeholder="Unit Cost">

        <button onclick="addItem()">
            Add Item
        </button>

    </div>

    <table>

        <thead>

            <tr>

                <th>Item</th>
                <th>Stock</th>
                <th>Unit Cost</th>
                <th>Updated</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="inventoryTable">

        </tbody>

    </table>

</div>

<script src="inventory.js"></script>

</body>
</html>
